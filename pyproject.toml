[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "matplotlib-omission"
version = "0.1.0"
description = "Broken value axes with wave or slash marks for Matplotlib bar charts"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.8,<4", "numpy>=1.24"]
keywords = ["matplotlib", "bar chart", "broken axis", "visualization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.urls]
Repository = "https://github.com/magichan-lab/matplotlib-omission"
Issues = "https://github.com/magichan-lab/matplotlib-omission/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["matplotlib_omission*"]

# uv 開発環境
[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
]

# pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=matplotlib_omission",
    "--cov-report=term-missing",
]

# pytest-cov
[tool.coverage.run]
branch = true
source = ["matplotlib_omission"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

# Ruff
[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

